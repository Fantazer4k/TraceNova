name: TraceNova checks

on:
  push:
    branches: [main, 'repair/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tracenova/requirements.txt
      - name: Python regression tests
        working-directory: tracenova
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check frontend JavaScript syntax
        run: node --check tracenova/frontend/static/script.js
      - name: Test frontend XSS protection
        run: node tracenova/tests/test_frontend_safety.js
