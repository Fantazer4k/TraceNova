<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraceNova - Public Digital Intelligence</title>
    <link rel="stylesheet" href="/static/style.css?v=result-states-1">
</head>
<body>
    <!-- Interactive Grid Background -->
    <canvas id="gridCanvas" aria-hidden="true"></canvas>

    <div class="container">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-content">
                <h1 class="logo">TraceNova</h1>
                <div class="nav-right">
                    <a href="https://github.com/Fantazer4k/TraceNova" target="_blank" class="nav-link">Docs</a>
                </div>
            </div>
        </nav>

        <!-- Hero -->
        <section class="hero">
            <h2 class="hero-title">Understand the Internet</h2>
            <p class="hero-subtitle">Check public sources and see what each one confirms</p>
            
            <div class="search-box-wrapper">
                <form class="search-box" id="searchForm" aria-label="Public-source analysis">
                    <div class="select-wrapper">
                        <select id="queryType" aria-label="Search type">
                            <optgroup label="Domain & Network">
                                <option value="domain">Domain</option>
                                <option value="url">URL</option>
                                <option value="ip">IP Address</option>
                            </optgroup>
                            <optgroup label="People & Accounts">
                                <option value="username">Username</option>
                                <option value="email">Email</option>
                                <option value="phone">Phone Number</option>
                            </optgroup>
                        </select>
                        <button type="button" id="helpIcon" class="help-icon"
                                aria-label="Search help" aria-haspopup="dialog" aria-controls="helpModal">?</button>
                    </div>
                    <input type="text" id="queryInput" aria-label="Search query"
                           placeholder="example.com" autocomplete="off" spellcheck="false">
                    <button type="submit" id="analyzeBtn">Analyze</button>
                </form>
                <p id="searchStatus" class="search-status" role="status"></p>

                <!-- Help Modal -->
                <dialog id="helpModal" class="help-modal" aria-labelledby="helpTitle" aria-describedby="helpText">
                    <div class="help-content">
                        <button type="button" id="closeHelp" class="close-help" aria-label="Close help" autofocus>✕</button>
                        <h3 id="helpTitle"></h3>
                        <p id="helpText"></p>
                    </div>
                </dialog>
            </div>
        </section>

        <!-- Results -->
        <section id="results" class="results hidden" aria-label="Analysis results">
            <div id="resultContent"></div>
        </section>
    </div>

    <script src="/static/interactions.js?v=accessible-help-1"></script>
    <script src="/static/script.js?v=result-states-1"></script>
</body>
</html>
